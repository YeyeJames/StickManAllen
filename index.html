<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>火柴人筆記本 — 作品典藏</title>
<meta name="description" content="手繪火柴人漫畫線上典藏，12本筆記本、逐頁連載。">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">

<!-- ═══════════════════════════════════════════════════════════
     設定區：只要改這裡就好
     每畫完一本，複製一行加進去，然後把圖片放進 books/13/ 資料夾
     ═══════════════════════════════════════════════════════════ -->
<script>
const SITE = {
  title: "火柴人筆記本",
  author: "小宇",                       // ← 改成兒子的筆名
  intro: "從小學四年級開始，一本一頁一格，畫到現在。",
  startYear: "2024",
};

const BOOKS = [
  // id 要跟資料夾名稱一模一樣。pages 是這本共幾頁。
  { id: "01", title: "StickMan01-跑酷", pages: 70, date: "2024.03", note: "第一本。主角撿到一台壞掉的太空船。" },
  { id: "02", title: "太空冒險 2", pages: 70, date: "2024.05", note: "" },
  { id: "03", title: "忍者學校",   pages: 68, date: "2024.07", note: "" },
  { id: "04", title: "忍者學校 2", pages: 70, date: "2024.09", note: "" },
  { id: "05", title: "怪獸大戰",   pages: 72, date: "2024.11", note: "" },
  { id: "06", title: "怪獸大戰 2", pages: 70, date: "2025.01", note: "" },
  { id: "07", title: "地下城",     pages: 70, date: "2025.03", note: "" },
  { id: "08", title: "地下城 2",   pages: 70, date: "2025.06", note: "" },
  { id: "09", title: "校園日常",   pages: 66, date: "2025.08", note: "" },
  { id: "10", title: "校園日常 2", pages: 70, date: "2025.10", note: "" },
  { id: "11", title: "最終決戰",   pages: 70, date: "2026.01", note: "" },
  { id: "12", title: "最終決戰 2", pages: 70, date: "2026.04", note: "最新一本，還在畫。" },
];

const EXT = "jpg";        // 圖片副檔名，如果是 png 就改成 "png"
const DIGITS = 3;         // 檔名補零位數：3 → 001.jpg
const FOLDER = "books";   // 放圖片的資料夾名稱
</script>

<style>
:root{
  --paper:#FCFCF8;
  --grid:#CBD9E2;
  --ink:#22242A;
  --ink-soft:#5C6068;
  --kraft:#B98F63;
  --kraft-dark:#8C6842;
  --red:#D6402C;
  --shadow:rgba(34,36,42,.16);

  --display:"LXGW WenKai TC","Noto Sans TC",system-ui,sans-serif;
  --body:"Noto Sans TC",system-ui,sans-serif;
  --mono:"Space Mono",ui-monospace,monospace;
}

*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{
  font-family:var(--body);
  color:var(--ink);
  background-color:var(--paper);
  background-image:
    linear-gradient(var(--grid) 1px,transparent 1px),
    linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:26px 26px;
  line-height:1.7;
  min-height:100vh;
}
body::before{
  content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
  background:radial-gradient(ellipse at 50% 0%,rgba(255,255,255,.9),rgba(255,255,255,0) 60%);
}
.wrap{position:relative;z-index:1;max-width:1080px;margin:0 auto;padding:0 20px}

/* ── 頁首 ───────────────────────────────── */
.masthead{padding:64px 0 20px}
.stamp{
  display:inline-block;font-family:var(--mono);font-size:11px;letter-spacing:.16em;
  color:var(--red);border:1.5px solid var(--red);border-radius:2px;
  padding:3px 9px;transform:rotate(-1.5deg);margin-bottom:22px;
}
.masthead h1{
  font-family:var(--display);font-weight:700;
  font-size:clamp(2.6rem,9vw,4.6rem);line-height:1.05;letter-spacing:-.01em;
}
.byline{font-family:var(--mono);font-size:13px;color:var(--ink-soft);margin-top:14px}
.byline b{color:var(--ink);font-weight:700}
.intro{max-width:34em;margin-top:18px;color:var(--ink-soft);font-size:15.5px}

.tally{
  display:flex;gap:26px;flex-wrap:wrap;margin-top:30px;padding-top:22px;
  border-top:1px solid rgba(34,36,42,.14);
}
.tally div{font-family:var(--mono);font-size:12px;color:var(--ink-soft);letter-spacing:.05em}
.tally strong{display:block;font-size:26px;color:var(--ink);line-height:1.2}

/* ── 書架 ───────────────────────────────── */
.shelf-label{
  font-family:var(--mono);font-size:11px;letter-spacing:.2em;color:var(--ink-soft);
  margin:56px 0 20px;padding-bottom:8px;border-bottom:1px solid rgba(34,36,42,.14);
}
.shelf{
  display:grid;gap:34px 26px;padding-bottom:80px;
  grid-template-columns:repeat(auto-fill,minmax(158px,1fr));
}

.book{
  appearance:none;border:0;background:none;padding:0;
  font:inherit;color:inherit;text-align:left;cursor:pointer;
  display:block;
}
.cover{
  position:relative;aspect-ratio:3/4;border-radius:3px 6px 6px 3px;
  background:linear-gradient(100deg,var(--kraft-dark) 0 13px,var(--kraft) 13px);
  box-shadow:0 3px 0 rgba(140,104,66,.45),0 10px 22px -8px var(--shadow);
  padding:12px 12px 12px 22px;overflow:hidden;
  transition:transform .22s cubic-bezier(.2,.8,.3,1),box-shadow .22s;
}
.book:hover .cover,.book:focus-visible .cover{
  transform:translateY(-7px) rotate(-1deg);
  box-shadow:0 3px 0 rgba(140,104,66,.45),0 20px 32px -10px var(--shadow);
}
.book:focus-visible{outline:none}
.book:focus-visible .cover{outline:2.5px solid var(--red);outline-offset:4px}

.rings{position:absolute;left:6px;top:0;bottom:0;width:11px;
  display:flex;flex-direction:column;justify-content:space-evenly;align-items:center}
.rings i{width:9px;height:9px;border-radius:50%;
  background:radial-gradient(circle at 35% 30%,#fff,#9a9ea6 60%,#6d717a);
  box-shadow:inset 0 -1px 1px rgba(0,0,0,.3)}

.cover-img{
  width:100%;height:100%;object-fit:cover;object-position:top center;
  background:#fff;border-radius:1px;display:block;
  box-shadow:0 1px 6px rgba(0,0,0,.22);
}
.cover-missing{
  width:100%;height:100%;background:#fff;border-radius:1px;
  display:flex;align-items:center;justify-content:center;padding:10px;
  font-family:var(--mono);font-size:9.5px;color:#9aa0a8;text-align:center;
  word-break:break-all;line-height:1.5;
}
.spine-no{
  position:absolute;right:9px;bottom:7px;font-family:var(--mono);font-weight:700;
  font-size:11px;color:rgba(255,255,255,.85);letter-spacing:.08em;
}

.meta{margin-top:12px}
.meta h3{font-family:var(--display);font-size:17px;font-weight:700;line-height:1.35}
.meta p{font-family:var(--mono);font-size:11px;color:var(--ink-soft);margin-top:3px;letter-spacing:.04em}

footer{
  padding:32px 0 60px;border-top:1px solid rgba(34,36,42,.14);
  font-family:var(--mono);font-size:11.5px;color:var(--ink-soft);line-height:2;
}

/* ── 閱讀器 ─────────────────────────────── */
.reader{
  position:fixed;inset:0;z-index:50;background:#1A1B1F;
  display:none;flex-direction:column;color:#EDEDEA;
  padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom);
}
.reader.open{display:flex}

.rbar{
  display:flex;align-items:center;gap:14px;padding:12px 16px;
  border-bottom:1px solid rgba(255,255,255,.1);flex:0 0 auto;
}
.rbar h2{font-family:var(--display);font-size:16px;font-weight:700;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.counter{font-family:var(--mono);font-size:12.5px;color:#9AA0A8;margin-left:auto;flex:0 0 auto}
.counter b{color:#fff;font-weight:700}

.iconbtn{
  appearance:none;border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.05);
  color:#EDEDEA;border-radius:6px;width:36px;height:36px;cursor:pointer;
  font-size:15px;display:grid;place-items:center;flex:0 0 auto;
  transition:background .15s,border-color .15s;
}
.iconbtn:hover{background:rgba(255,255,255,.14)}
.iconbtn:focus-visible{outline:2.5px solid var(--red);outline-offset:2px}
.iconbtn.on{background:var(--red);border-color:var(--red);color:#fff}

.stage{
  flex:1 1 auto;min-height:0;display:grid;place-items:center;
  padding:16px;position:relative;touch-action:pan-y;user-select:none;
}
.stage img{
  max-width:100%;max-height:100%;object-fit:contain;background:#fff;
  border-radius:2px;box-shadow:0 14px 40px -10px rgba(0,0,0,.7);
}
.stage img.drop{animation:drop .16s ease-out}
@keyframes drop{from{opacity:.25;transform:translateY(-5px)}to{opacity:1;transform:none}}

.nav-zone{position:absolute;top:0;bottom:0;width:32%;cursor:pointer;border:0;background:none}
.nav-zone.prev{left:0}
.nav-zone.next{right:0}
.nav-zone:focus-visible{outline:2.5px solid var(--red);outline-offset:-4px}

.missing{
  font-family:var(--mono);font-size:12.5px;color:#9AA0A8;text-align:center;
  line-height:2;padding:24px;max-width:32em;
}
.missing b{color:#fff;display:block;font-size:14px;margin-bottom:8px}

.rfoot{
  flex:0 0 auto;border-top:1px solid rgba(255,255,255,.1);
  padding:12px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;
}
.scrub{
  flex:1 1 180px;appearance:none;height:22px;background:none;cursor:pointer;margin:0;
}
.scrub::-webkit-slider-runnable-track{height:3px;background:rgba(255,255,255,.22);border-radius:2px}
.scrub::-webkit-slider-thumb{appearance:none;width:15px;height:15px;border-radius:50%;
  background:var(--red);margin-top:-6px;border:0}
.scrub::-moz-range-track{height:3px;background:rgba(255,255,255,.22);border-radius:2px}
.scrub::-moz-range-thumb{width:15px;height:15px;border-radius:50%;background:var(--red);border:0}
.scrub:focus-visible{outline:2.5px solid var(--red);outline-offset:3px;border-radius:4px}

.speed{display:flex;align-items:center;gap:8px;font-family:var(--mono);font-size:11px;color:#9AA0A8}
.speed input{width:88px}
.speed b{color:#fff;min-width:3.4em}

/* 縮圖面板 */
.grid-panel{
  position:absolute;inset:0;background:#1A1B1F;overflow-y:auto;display:none;
  padding:16px;z-index:5;
}
.grid-panel.open{display:block}
.thumbs{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(88px,1fr))}
.thumbs button{
  appearance:none;border:1.5px solid transparent;background:#fff;border-radius:2px;
  padding:0;cursor:pointer;aspect-ratio:3/4;overflow:hidden;position:relative;
}
.thumbs button.here{border-color:var(--red)}
.thumbs img{width:100%;height:100%;object-fit:cover;object-position:top center;display:block}
.thumbs span{
  position:absolute;left:0;bottom:0;background:rgba(26,27,31,.82);color:#fff;
  font-family:var(--mono);font-size:9.5px;padding:1px 4px;border-radius:0 2px 0 0;
}

@media (max-width:600px){
  .masthead{padding-top:40px}
  .shelf{grid-template-columns:repeat(auto-fill,minmax(128px,1fr));gap:26px 18px}
  .rfoot{gap:8px}
  .speed{order:3;width:100%;justify-content:flex-end}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}
}
</style>
</head>
<body>

<div class="wrap">
  <header class="masthead">
    <div class="stamp" id="stamp">ARCHIVE</div>
    <h1 id="siteTitle"></h1>
    <p class="byline">作者 <b id="author"></b></p>
    <p class="intro" id="intro"></p>
    <div class="tally">
      <div>本數<strong id="tBooks">—</strong></div>
      <div>總頁數<strong id="tPages">—</strong></div>
      <div>創作期間<strong id="tSpan">—</strong></div>
    </div>
  </header>

  <h2 class="shelf-label">全部筆記本 — 點一本開始看</h2>
  <div class="shelf" id="shelf"></div>

  <footer>
    <div id="copyright"></div>
    <div>本站為個人創作典藏，圖片版權屬作者所有。</div>
  </footer>
</div>

<!-- 閱讀器 -->
<div class="reader" id="reader" role="dialog" aria-modal="true" aria-label="漫畫閱讀器">
  <div class="rbar">
    <button class="iconbtn" id="btnClose" aria-label="關閉">✕</button>
    <h2 id="rTitle"></h2>
    <div class="counter"><b id="rNow">1</b> / <span id="rTotal">1</span></div>
  </div>

  <div class="stage" id="stage">
    <img id="page" alt="" hidden>
    <div class="missing" id="missing" hidden></div>
    <button class="nav-zone prev" id="zPrev" aria-label="上一頁"></button>
    <button class="nav-zone next" id="zNext" aria-label="下一頁"></button>

    <div class="grid-panel" id="gridPanel">
      <div class="thumbs" id="thumbs"></div>
    </div>
  </div>

  <div class="rfoot">
    <button class="iconbtn" id="btnPrev" aria-label="上一頁">‹</button>
    <button class="iconbtn" id="btnPlay" aria-label="播放翻頁動畫">▶</button>
    <button class="iconbtn" id="btnNext" aria-label="下一頁">›</button>
    <input class="scrub" id="scrub" type="range" min="1" value="1" aria-label="跳到指定頁">
    <button class="iconbtn" id="btnGrid" aria-label="全部頁面縮圖">▦</button>
    <label class="speed">速度
      <input id="fps" type="range" min="1" max="16" value="5" aria-label="播放速度">
      <b id="fpsVal">5 fps</b>
    </label>
  </div>
</div>

<script>
(function(){
  "use strict";

  const $ = id => document.getElementById(id);
  const pad = n => String(n).padStart(DIGITS, "0");
  const src = (book, n) => `${FOLDER}/${book.id}/${pad(n)}.${EXT}`;

  /* ── 首頁 ───────────────────────────── */
  $("siteTitle").textContent = SITE.title;
  $("author").textContent = SITE.author;
  $("intro").textContent = SITE.intro;

  const totalPages = BOOKS.reduce((s, b) => s + b.pages, 0);
  $("tBooks").textContent = BOOKS.length;
  $("tPages").textContent = totalPages;

  const dates = BOOKS.map(b => b.date).filter(Boolean).sort();
  $("tSpan").textContent = dates.length ? `${dates[0]} – ${dates[dates.length - 1]}` : "—";
  $("stamp").textContent = `NO.01–${pad(BOOKS.length).slice(-2)} / ${totalPages} PAGES`;
  $("copyright").textContent =
    `© ${SITE.startYear}–${new Date().getFullYear()} ${SITE.author}`;

  const shelf = $("shelf");
  BOOKS.forEach((book, i) => {
    const btn = document.createElement("button");
    btn.className = "book";
    btn.innerHTML = `
      <div class="cover">
        <div class="rings"><i></i><i></i><i></i><i></i><i></i><i></i></div>
        <img class="cover-img" alt="" loading="lazy">
        <div class="spine-no">NO.${book.id}</div>
      </div>
      <div class="meta">
        <h3></h3>
        <p></p>
      </div>`;
    btn.querySelector("h3").textContent = book.title || `第 ${book.id} 本`;
    btn.querySelector(".meta p").textContent =
      `${book.date || ""}${book.date ? " · " : ""}${book.pages} 頁`;

    const img = btn.querySelector(".cover-img");
    const path = src(book, 1);
    img.src = path;
    img.onerror = () => {
      const ph = document.createElement("div");
      ph.className = "cover-missing";
      ph.textContent = `把圖片放在\n${path}`;
      ph.style.whiteSpace = "pre-line";
      img.replaceWith(ph);
    };

    btn.addEventListener("click", () => open(i));
    shelf.appendChild(btn);
  });

  /* ── 閱讀器 ─────────────────────────── */
  const reader = $("reader"), pageImg = $("page"), missing = $("missing");
  const scrub = $("scrub"), gridPanel = $("gridPanel"), thumbs = $("thumbs");
  let book = null, cur = 1, timer = null, lastFocus = null;

  function open(index){
    book = BOOKS[index];
    cur = 1;
    lastFocus = document.activeElement;
    $("rTitle").textContent = book.title || `第 ${book.id} 本`;
    $("rTotal").textContent = book.pages;
    scrub.max = book.pages;
    reader.classList.add("open");
    document.body.style.overflow = "hidden";
    buildThumbs();
    show(1);
    $("btnClose").focus();
    history.replaceState(null, "", `#${book.id}`);
  }

  function close(){
    stop();
    reader.classList.remove("open");
    gridPanel.classList.remove("open");
    $("btnGrid").classList.remove("on");
    document.body.style.overflow = "";
    history.replaceState(null, "", location.pathname);
    if (lastFocus) lastFocus.focus();
  }

  function show(n){
    cur = Math.min(Math.max(1, n), book.pages);
    const path = src(book, cur);
    pageImg.hidden = false;
    missing.hidden = true;
    pageImg.classList.remove("drop");
    void pageImg.offsetWidth;
    pageImg.classList.add("drop");
    pageImg.alt = `${book.title} 第 ${cur} 頁`;
    pageImg.src = path;
    pageImg.onerror = () => {
      pageImg.hidden = true;
      missing.hidden = false;
      missing.innerHTML = `<b>找不到這一頁</b>預期的檔案位置：<br>${path}<br><br>` +
        `請確認檔名是 ${pad(cur)}.${EXT}，放在 ${FOLDER}/${book.id}/ 資料夾裡。`;
    };
    $("rNow").textContent = cur;
    scrub.value = cur;
    for (let k = 1; k <= 4; k++) {
      if (cur + k <= book.pages) new Image().src = src(book, cur + k);
    }
    const active = thumbs.querySelector(".here");
    if (active) active.classList.remove("here");
    const t = thumbs.children[cur - 1];
    if (t) t.classList.add("here");
  }

  function go(d){
    if (cur + d > book.pages) { stop(); show(1); return; }
    if (cur + d < 1) { show(book.pages); return; }
    show(cur + d);
  }

  function play(){
    stop();
    const fps = Number($("fps").value);
    timer = setInterval(() => {
      if (cur >= book.pages) { stop(); return; }
      show(cur + 1);
    }, 1000 / fps);
    $("btnPlay").textContent = "❚❚";
    $("btnPlay").classList.add("on");
    $("btnPlay").setAttribute("aria-label", "暫停");
  }

  function stop(){
    if (timer) clearInterval(timer);
    timer = null;
    $("btnPlay").textContent = "▶";
    $("btnPlay").classList.remove("on");
    $("btnPlay").setAttribute("aria-label", "播放翻頁動畫");
  }

  function buildThumbs(){
    thumbs.innerHTML = "";
    for (let n = 1; n <= book.pages; n++) {
      const b = document.createElement("button");
      b.innerHTML = `<img loading="lazy" alt=""><span>${pad(n)}</span>`;
      b.querySelector("img").src = src(book, n);
      b.addEventListener("click", () => {
        show(n);
        gridPanel.classList.remove("open");
        $("btnGrid").classList.remove("on");
      });
      thumbs.appendChild(b);
    }
  }

  /* 控制 */
  $("btnClose").onclick = close;
  $("btnPrev").onclick = () => { stop(); go(-1); };
  $("btnNext").onclick = () => { stop(); go(1); };
  $("zPrev").onclick  = () => { stop(); go(-1); };
  $("zNext").onclick  = () => { stop(); go(1); };
  $("btnPlay").onclick = () => timer ? stop() : play();
  scrub.oninput = () => { stop(); show(Number(scrub.value)); };
  $("fps").oninput = () => {
    $("fpsVal").textContent = $("fps").value + " fps";
    if (timer) play();
  };
  $("btnGrid").onclick = () => {
    stop();
    const on = gridPanel.classList.toggle("open");
    $("btnGrid").classList.toggle("on", on);
  };

  document.addEventListener("keydown", e => {
    if (!reader.classList.contains("open")) return;
    if (e.key === "Escape") { close(); }
    else if (e.key === "ArrowRight" || e.key === "ArrowDown") { stop(); go(1); }
    else if (e.key === "ArrowLeft" || e.key === "ArrowUp") { stop(); go(-1); }
    else if (e.key === " ") { e.preventDefault(); timer ? stop() : play(); }
    else return;
  });

  /* 手機滑動翻頁 */
  let x0 = null, y0 = null;
  const stage = $("stage");
  stage.addEventListener("touchstart", e => {
    x0 = e.touches[0].clientX; y0 = e.touches[0].clientY;
  }, {passive:true});
  stage.addEventListener("touchend", e => {
    if (x0 === null) return;
    const dx = e.changedTouches[0].clientX - x0;
    const dy = e.changedTouches[0].clientY - y0;
    if (Math.abs(dx) > 45 && Math.abs(dx) > Math.abs(dy)) { stop(); go(dx < 0 ? 1 : -1); }
    x0 = y0 = null;
  }, {passive:true});

  /* 網址帶 #01 直接開該本 */
  const hash = location.hash.replace("#", "");
  if (hash) {
    const i = BOOKS.findIndex(b => b.id === hash);
    if (i >= 0) open(i);
  }
})();
</script>
